name: Coach joint diagnostics

on:
  push:
    branches:
      - arena/5aa3aaf8-parisfit
    paths:
      - 'tools/motion-review/joint-diagnostics.cjs'
      - 'tools/coach-lab.html'
      - 'assets/coach/coach.glb'
      - 'vendor/three/**'
      - '.github/workflows/coach-joint-diagnostics.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'tools/motion-review/joint-diagnostics.cjs'
      - 'tools/coach-lab.html'
      - 'assets/coach/coach.glb'
      - 'vendor/three/**'
      - '.github/workflows/coach-joint-diagnostics.yml'

concurrency:
  group: parisfit-coach-joint-diagnostics
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout isolated preview branch
        uses: actions/checkout@v4
        with:
          ref: arena/5aa3aaf8-parisfit
          persist-credentials: true
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install project dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Diagnose original coach clips
        run: node tools/motion-review/joint-diagnostics.cjs
      - name: Archive diagnostic report
        uses: actions/upload-artifact@v4
        with:
          name: parisfit-coach-joint-diagnostics
          path: docs/development/motion-review/joint-diagnostics.json
          if-no-files-found: error
          retention-days: 14
      - name: Commit diagnostic report to isolated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/development/motion-review/joint-diagnostics.json
          git commit -m "Add coach joint diagnostic results" || echo "No report changes"
          git fetch origin arena/5aa3aaf8-parisfit
          git rebase origin/arena/5aa3aaf8-parisfit
          git push origin HEAD:arena/5aa3aaf8-parisfit
