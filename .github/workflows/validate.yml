          python3 - <<'PY'
          from pathlib import Path
          import zlib,base64
          p=Path('.cache/phase13/review-data.json')
          if p.exists():
              raw=base64.b64encode(zlib.compress(p.read_bytes(),9)).decode()
              assert len(raw)<=152000,'REVIEW_TRANSPORT_SIZE'
              for i in range(0,min(len(raw),30400),3800):print('::warning title=phase13-review-data.json-'+str(i//3800)+'::'+raw[i:i+3800])
          PY
      - name: Phase13 small reproducible review data 2
