name: PARISFIT — validation du socle
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Vérifier la syntaxe JavaScript
        run: |
          node --check app.js
          node --check demo-data.js
          node --check service-worker.js
          node --input-type=module --check < coach-content.js
          node tests/coach-evidence.cjs
          node tests/coach-transition-evidence.cjs
          node tests/coach-transition-gate.cjs
          node tests/coach-contact-evidence.cjs
          node tests/coach-mocap-evidence.cjs
          node tests/coach-cmu-evidence.cjs
          node tests/coach-production-pipeline.cjs
          python3 tools/animation-pipeline/test_gate.py
          python3 tools/capture-pipeline/test_intake.py
          python3 tools/capture-pipeline/test_permissions.py
          node tests/coach-capture-readiness.cjs
          node tests/coach-blender-evidence.cjs
          node tests/coach-biomechanics-evidence.cjs
          node tests/coach-anatomy-evidence.cjs
          node tests/coach-source-qualification.cjs
          node tests/coach-asset.cjs
          node --input-type=module --check < coach-3d.js
      - name: Vérifier le manifeste PWA
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8')); console.log('Manifest JSON valide')"
      - name: Vérifier les fichiers essentiels et les quatre vues
        run: |
          test -s index.html && test -s styles.css && test -s app.js && test -s coach-3d.js && test -s service-worker.js
          grep -q 'id="view-today"' index.html
          grep -q 'id="view-switch"' index.html
          grep -q 'id="view-nutrition"' index.html
          grep -q 'id="view-mental"' index.html
          echo "Socle PARISFIT présent"

      - name: Install browser test tools
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser regression and 3D tests
        run: |
          python3 -m http.server 3000 --bind 0.0.0.0 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          npm run test:browser
      - name: Keep review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coach-browser-review
          path: |
            .cache/coach-review/
            docs/coach/phase3/*report.json
            docs/coach/phase4/*report.json
            docs/coach/phase5/*report.json
            docs/coach/phase6/*report.json
            docs/coach/phase7/*report.json
  blender-control:
    # Public licensed fixtures ONLY. Never upload personal capture to this workflow.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install real Blender Python runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg blender python3-numpy python3-requests libxrender1 libxxf86vm1 libxfixes3 libxi6 libxkbcommon0 libsm6 libice6 libgl1 libegl1 libx11-6 libxext6 libgomp1
          blender --version
          mkdir -p .cache/phase9
          python -m pip freeze > .cache/phase9/python-packages.txt
          dpkg-query -W > .cache/phase9/system-packages.txt
      - name: Execute BVH calibration and Rocketbox retarget in Blender
        run: blender --background --factory-startup --python-exit-code 1 --python tools/blender-pipeline/retarget.py > .cache/phase9/blender.log 2>&1
      - name: Expose diagnostic evidence through check annotations
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ["blender-report.json", "blender.log"]:
              p=Path(".cache/phase9")/name
              if p.exists():
                  text=p.read_text()[-14000:]
                  print("::warning title="+name+"::"+text.replace("%","%25").replace("\r","%0D").replace("\n","%0A"))
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify GLB in real Three.js browser
        run: |
          npm ci
          npx playwright install --with-deps chromium
          python -m http.server 3000 --bind 0.0.0.0 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          node tools/blender-pipeline/check.cjs
      - name: Expose Three.js result
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path(".cache/phase9/three-report.json")
          if p.exists():
              print("::warning title=three-report.json::"+p.read_text().replace("%","%25").replace("\n","%0A"))
          PY
      - name: Phase10 independent pre-export audit and controlled floor comparison
        run: |
          mkdir -p .cache/phase10
          python tools/biomechanics/test_contracts.py
          blender --background --factory-startup --python-exit-code 1 --python tools/biomechanics/export.py > .cache/phase10/blender.log 2>&1
          python tools/biomechanics/test_generated.py
      - name: Phase10 Three.js and complete comparison videos
        run: |
          python -m http.server 3000 --bind 0.0.0.0 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          node tools/biomechanics/check.cjs
          FFMPEG_PATH=$(command -v ffmpeg) node tools/biomechanics/capture.cjs
          python tools/biomechanics/verify-videos.py
          python tools/biomechanics/build-gallery.py
      - name: Phase10 public control diagnostics
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,base64,zlib
          for name in ["before-report.json","after-report.json","comparison-report.json","morphology-report.json","three-report.json","video-report.json","blender.log"]:
              p=Path(".cache/phase10")/name
              if p.exists():
                  text=p.read_text()[-16000:]
                  if name.endswith(".json"):
                      encoded=base64.b64encode(zlib.compress(p.read_bytes(),9)).decode()
                      for i in range(0,len(encoded),2500):
                          print("::warning title=phase10-b64-"+name+"-"+str(i//2500)+"::"+encoded[i:i+2500])
                      continue
                  print("::warning title=phase10-"+name+"::"+text.replace("%","%25").replace("\r","%0D").replace("\n","%0A"))
          PY
      - name: Phase10 control artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase10-control-review
          path: .cache/phase10/
          retention-days: 30
      - name: Phase11 anatomy and three methods
        run: |
          mkdir -p .cache/phase11
          for method in A B C; do
            blender --background --factory-startup --python-exit-code 1 --python tools/anatomy/export.py -- --method "$method" > ".cache/phase11/$method.log" 2>&1
          done
          python -m http.server 3000 --bind 0.0.0.0 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          python tools/anatomy/test_generated.py
          node tools/anatomy/check.cjs
          FFMPEG_PATH=$(command -v ffmpeg) node tools/anatomy/capture.cjs
          node tools/anatomy/diagnostic-video.cjs
          python tools/anatomy/package.py
          python tools/anatomy/test_metrics.py
      - name: Phase11 evidence transport
        if: always()
        run: |
          python - <<'PY'
          import json,zlib,base64
          from pathlib import Path
          root=Path('.cache/phase11')
          for name in ['A/report.json','B/report.json','C/report.json','three-report.json']:
              p=root/name
              if p.exists():
                  raw=base64.b64encode(zlib.compress(p.read_bytes(),9)).decode()
                  for i in range(0,len(raw),3000):print('::warning title=phase11-'+name.replace('/','_')+'-'+str(i//3000)+'::'+raw[i:i+3000])
          for p in root.glob('*.log'):
              print('::notice title=phase11-log-'+p.stem+'::'+p.read_text()[-2500:].replace('%','%25').replace('\n','%0A'))
          PY
      - name: Phase11 skeleton inventory transport
        if: always()
        run: |
          python - <<'PY'
          import zlib,base64
          from pathlib import Path
          p=Path('.cache/phase11/anatomy-summary.json')
          if p.exists():
              raw=base64.b64encode(zlib.compress(p.read_bytes(),9)).decode()
              for i in range(0,min(len(raw),38000),3800):print('::warning title=phase11-anatomy-summary.json-'+str(i//3800)+'::'+raw[i:i+3800])
          PY
      - name: Phase11 skeleton inventory continuation
        if: always()
        run: |
          python - <<'PY'
          import zlib,base64
          from pathlib import Path
          p=Path('.cache/phase11/anatomy-summary.json')
          if p.exists():
              raw=base64.b64encode(zlib.compress(p.read_bytes(),9)).decode()
              for i in range(38000,len(raw),3800):print('::warning title=phase11-anatomy-summary.json-'+str(i//3800)+'::'+raw[i:i+3800])
          PY
      - name: Phase11 video inventory transport
        if: always()
        run: |
          python - <<'PY'
          import zlib,base64
          from pathlib import Path
          p=Path('.cache/phase11/video-report.json')
          if p.exists():
              raw=base64.b64encode(zlib.compress(p.read_bytes(),9)).decode()
              for i in range(0,len(raw),3000):print('::warning title=phase11-video-report.json-'+str(i//3000)+'::'+raw[i:i+3000])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase11-anatomical-diagnostics
          path: .cache/phase11/
          retention-days: 30
      - name: Preserve control evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase9-blender-control
          path: .cache/phase9/
          retention-days: 30
  source-qualification:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Source audit environment
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-numpy python3-pil python3-venv ffmpeg
          python3 -m venv --system-site-packages .cache/source-env
          .cache/source-env/bin/pip install c3d==0.6.0
      - name: Public pinned source screening
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/source-benchmark/download.py
          python3 tools/source-benchmark/test_audit.py
          python3 tools/source-benchmark/audit.py
          python3 tools/source-benchmark/visuals.py
          python3 tools/source-benchmark/originals.py
          .cache/source-env/bin/python tools/source-benchmark/analyze-originals.py
          python3 tools/source-benchmark/marker-benchmark.py
          python3 tools/source-benchmark/gallery.py
      - name: Source audit evidence
        if: always()
        run: |
          python3 - <<'PY'
          import json,zlib,base64
          from pathlib import Path
          root=Path('.cache/phase12')
          for name in ['14_06-report.json','original-retrieval.json','visual-report.json']:
              p=root/name
              if p.exists():
                  raw=base64.b64encode(zlib.compress(p.read_bytes(),9)).decode()
                  for i in range(0,len(raw),3800):print('::warning title=phase12-'+name+'-'+str(i//3800)+'::'+raw[i:i+3800])
          PY
      - name: Original file analysis evidence
        if: always()
        run: |
          python3 - <<'PY'
          import zlib,base64
          from pathlib import Path
          p=Path('.cache/phase12/original-analysis.json')
          if p.exists():
              raw=base64.b64encode(zlib.compress(p.read_bytes(),9)).decode()
              for i in range(0,len(raw),3800):print('::warning title=phase12-original-analysis.json-'+str(i//3800)+'::'+raw[i:i+3800])
