name: PARISFIT — validation du socle
on:
  push:
    branches: [main, "feat/**", "test/**", "docs/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Vérifier la syntaxe JavaScript
        run: node --check app.js
      - name: Vérifier la structure de l'application
        run: node scripts/validate.mjs
      - name: Exécuter les tests automatisés
        run: node --test
      - name: Vérifier le manifeste PWA
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8')); console.log('Manifest JSON valide')"
      - name: Vérifier la documentation de référence
        run: |
          test -s README.md
          test -s CAHIER_DES_CHARGES.md
          test -s PROMPT_MAITRE.md
          test -s ARCHITECTURE.md
          test -s ROADMAP.md
          test -s DATA_MODEL.md
          test -s API_CONTRACT.md
          test -s BACKEND_DECISION.md
          test -s AUTH_SYNC_SECURITY.md
