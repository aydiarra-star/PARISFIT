name: PARISFIT — publication GitHub Pages

on:
  workflow_dispatch:
    inputs:
      confirm_deployment:
        description: "Autorisation explicite de publier en production"
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm_deployment == true }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5
      - name: Construire uniquement les ressources publiques autorisées
        run: python3 tools/animation-lock/build_public.py
      - name: Préparer les fichiers statiques
        uses: actions/upload-pages-artifact@v3
        with:
          path: .cache/public
      - name: Publier PARISFIT
        id: deployment
        uses: actions/deploy-pages@v4
