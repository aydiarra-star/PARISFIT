 const data=await(await fetch('/docs/coach/phase5/pose-estimates.json')).json();const gltf=await new GLTFLoader().loadAsync('/assets/coach/coach.glb'),model=gltf.scene;model.animations=[];model.updateMatrixWorld(true);const root=model.getObjectByName('Bip01'),bones=[],meshes=[];model.traverse(o=>{if(o.isBone)bones.push(o);if(o.isSkinnedMesh)meshes.push(o)});
 const get=n=>model.getObjectByName('Bip01_'+n),vec=(p)=>new T.Vector3(p[0],-p[1],-p[2]),pos=b=>b.getWorldPosition(new T.Vector3());const rest=new Map(bones.map(b=>[b.name,{p:b.position.clone(),q:b.quaternion.clone(),w:b.getWorldQuaternion(new T.Quaternion()),point:pos(b)}]));const rootP=root.position.clone(),rootQ=root.quaternion.clone();

 const start=24,end=75,initial=data.framesData[start];const mid=(p,a,b)=>p[a].clone().add(p[b]).multiplyScalar(.5);
 const first=initial.worldFiltered.map(vec),lateral=first[23].clone().sub(first[24]);const yaw=Math.atan2(lateral.z,lateral.x),rotation=new T.Quaternion().setFromAxisAngle(new T.Vector3(0,1,0),yaw);
 const hipY=f=>(f.imageFiltered[23][1]+f.imageFiltered[24][1])/2,hipX=f=>(f.imageFiltered[23][0]+f.imageFiltered[24][0])/2;
 const legLength=pos(get('L_Thigh')).distanceTo(pos(get('L_Calf')))+pos(get('L_Calf')).distanceTo(pos(get('L_Foot')));const imageLeg=Math.abs(hipY(initial)-(initial.imageFiltered[27][1]+initial.imageFiltered[28][1])/2);const scale=legLength/imageLeg;

  for(const [s,h,k,a,sh,e,w,heel,toe]of [['L',23,25,27,11,13,15,29,31],['R',24,26,28,12,14,16,30,32]]){

   direction(s+'_Foot',s+'_Toe0',points[toe].clone().sub(points[heel]));

   // Pose has no finger articulation: preserve wrist-relative bind pose, never invent a grip.
   const hand=get(s+'_Hand');hand.quaternion.copy(rest.get(hand.name).q);hand.updateWorldMatrix(false,true);
  }
  model.updateMatrixWorld(true);rawPositions.push(root.position.toArray());let floor=Infinity;for(const m of meshes){m.skeleton.update();for(let i=0;i<m.geometry.attributes.position.count;i++){const p=m.getVertexPosition(i,new T.Vector3()).applyMatrix4(m.matrixWorld);floor=Math.min(floor,p.y)}}
