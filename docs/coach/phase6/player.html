<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Laboratoire CMU · Three.js</title><style>*{box-sizing:border-box}body{font:16px system-ui;color:#164a35;background:#edf5ef;margin:0;padding:16px}main{max-width:800px;margin:auto}#stage{height:460px;background:#edf5ef}canvas{width:100%;height:100%;display:block}button,select,input{font:inherit;margin:6px;padding:8px;max-width:95%}#timeline{width:95%}p{line-height:1.5}@media(max-width:500px){#stage{height:360px}}</style><main><h1>Lecture de diagnostic</h1><p>Pas un exercice activé. Le mouvement s’arrête à sa dernière pose : aucune boucle ou raccord n’est approuvé. <a href="index.html">Preuves et limites</a></p><label>Version<select id="asset"><option value="retargeted">Retargetée</option><option value="corrected">Corrigée par fenêtres</option></select></label><div id="stage"></div><p id="status" role="status">Chargement…</p><button id="play" disabled>Lire</button><button id="reset" disabled>Début</button><label>Vitesse<select id="speed"><option value="1">1×</option><option value="0.5">0,5×</option><option value="0.25">0,25×</option></select></label><label>Caméra<select id="view"><option value="0">Face</option><option value="1">Profil</option><option value="2">Trois-quarts</option></select></label><input type="range" id="timeline" min="0" max="2.4" step="0.001" value="0" aria-label="Temps dans la séquence" disabled></main>
<script type="module">
import * as T from '../../../vendor/three/three.module.js';import {GLTFLoader} from '../../../vendor/three/loaders/GLTFLoader.js';import {OrbitControls} from '../../../vendor/three/controls/OrbitControls.js';
const $=id=>document.getElementById(id),host=$('stage'),scene=new T.Scene();scene.background=new T.Color('#edf5ef');const renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.25));host.append(renderer.domElement);const camera=new T.PerspectiveCamera(34,1,.05,30),orbit=new OrbitControls(camera,renderer.domElement);orbit.enablePan=false;orbit.minDistance=2;orbit.maxDistance=6;scene.add(new T.HemisphereLight(0xffffff,0x739183,2));const light=new T.DirectionalLight(0xfff4e7,2.6);light.position.set(-2,4,3);scene.add(light);const floor=new T.Mesh(new T.PlaneGeometry(8,8),new T.MeshStandardMaterial({color:'#e0eae2'}));floor.rotation.x=-Math.PI/2;scene.add(floor);
let model,mixer,action,ready=false,paused=true,raf=0,last=0,token=0;const draw=()=>renderer.render(scene,camera);function stop(){paused=true;cancelAnimationFrame(raf);raf=0;$('play').textContent='Lire'}function view(){const positions=[[0,1.28,4.6],[4.6,1.28,0],[3.3,1.28,3.3]];camera.position.set(...positions[Number($('view').value)]);orbit.target.set(0,1.02,0);orbit.update();draw()}orbit.addEventListener('change',draw);function resize(){renderer.setSize(host.clientWidth,host.clientHeight,false);camera.aspect=host.clientWidth/host.clientHeight;camera.updateProjectionMatrix();draw()}new ResizeObserver(resize).observe(host);view();
function seek(t){if(!ready)return;action.enabled=true;action.paused=false;action.time=Math.min(action.getClip().duration,Math.max(0,t));mixer.update(0);$('timeline').value=action.time;draw()}
function tick(now){raf=0;if(paused||document.hidden||!ready)return;const dt=Math.min(.05,(now-last)/1000);last=now;seek(action.time+dt*Number($('speed').value));if(action.time>=action.getClip().duration-1e-6){stop();$('status').textContent='Fin — retour debout observé, récupération non approuvée.'}else raf=requestAnimationFrame(tick)}
async function load(){stop();ready=false;const current=++token;$('play').disabled=$('reset').disabled=$('timeline').disabled=true;$('status').textContent='Chargement…';if(model){scene.remove(model);mixer.stopAllAction();mixer.uncacheRoot(model);const textures=new Set();model.traverse(o=>{o.geometry?.dispose();if(o.isSkinnedMesh)o.skeleton.dispose();for(const m of o.material?(Array.isArray(o.material)?o.material:[o.material]):[]){for(const v of Object.values(m))if(v?.isTexture)textures.add(v);m.dispose()}});textures.forEach(t=>t.dispose());model=null}
try{const gltf=await new GLTFLoader().loadAsync('./'+$('asset').value+'.glb');if(current!==token)return;model=gltf.scene;scene.add(model);mixer=new T.AnimationMixer(model);action=mixer.clipAction(gltf.animations[0]);action.setLoop(T.LoopOnce);action.clampWhenFinished=true;action.play();ready=true;$('timeline').max=action.getClip().duration;$('play').disabled=$('reset').disabled=$('timeline').disabled=false;seek(0);$('status').textContent='Prêt — expérimental, non validé. Lecture manuelle uniquement.'}catch(e){$('status').textContent='Échec du chargement. Réessayer en sélectionnant une version.'}}
$('asset').onchange=load;$('view').onchange=view;$('reset').onclick=()=>{stop();seek(0)};$('timeline').oninput=e=>{stop();seek(Number(e.target.value))};$('play').onclick=()=>{if(!paused){stop();return}if(action.time>=action.getClip().duration-1e-6)seek(0);paused=false;$('play').textContent='Pause';last=performance.now();raf=requestAnimationFrame(tick)};document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change',stop);renderer.domElement.addEventListener('webglcontextlost',e=>{e.preventDefault();stop();ready=false;$('play').disabled=true;$('status').textContent='Contexte WebGL perdu : recharge le laboratoire.'});window.inspectReview=()=>({ready,paused,time:action?.time,duration:action?.getClip().duration,frames:renderer.info.render.frame,camera:camera.position.toArray(),asset:$('asset').value});load();
</script></html>
